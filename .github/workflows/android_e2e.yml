name: Android E2E Tests

on:
  pull_request:
    branches: [master, v2, v1]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, v2, v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boringssl-e2e:
    name: Android E2E Tests / API ${{ matrix.api-level }} / BoringSSL
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # BoringSSL offsets are version-specific, so cover every stable Android
        # release from the supported lower bound through Android 16.
        api-level: [33, 34, 35, 36]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential pkg-config libelf-dev llvm-14 clang-14 \
            flex bison linux-tools-common linux-tools-generic linux-source \
            libssl-dev libpulse0 xvfb libxcb-cursor0 libxkbcommon-x11-0
          for tool in clang llc llvm-strip; do
            sudo ln -sf "/usr/bin/${tool}-14" "/usr/bin/${tool}"
          done
          source_file="$(find /usr/src -maxdepth 1 -name 'linux-source*.tar.bz2' | head -n 1)"
          source_dir="${source_file%.tar.bz2}"
          # The linux-source package may create the target directory before
          # leaving the actual source tree in the tarball.  Check for the
          # kernel Makefile instead of the directory itself.
          if [[ -n "$source_file" && ! -f "$source_dir/Makefile" ]]; then
            sudo tar -xf "$source_file" -C /usr/src
          fi
          if [[ -n "$source_dir" && ! -f "$source_dir/.config" ]]; then
            if [[ -r "/boot/config-$(uname -r)" ]]; then
              sudo cp "/boot/config-$(uname -r)" "$source_dir/.config"
              sudo make -C "$source_dir" olddefconfig
            else
              sudo make -C "$source_dir" defconfig
            fi
          fi

      # Preinstall every package used by android-emulator-runner.  In run
      # 37174543624 sdkmanager downloaded a corrupt API 35 system-image ZIP;
      # installing here gives that transient failure bounded retries before
      # the emulator action starts.
      - name: Install Android SDK packages with retry
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$sdkmanager_bin" ]]; then
            echo "sdkmanager not found below Android SDK root: $sdk_root" >&2
            exit 1
          fi

          system_image="system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          packages=(
            "platform-tools"
            "emulator"
            "platforms;android-${{ matrix.api-level }}"
            "build-tools;35.0.0"
            "$system_image"
          )

          for attempt in 1 2 3; do
            echo "Android SDK install attempt $attempt/3"
            # sdkmanager closes stdin when it is done; without this temporary
            # setting pipefail would turn yes(1)'s SIGPIPE into a false error.
            set +o pipefail
            if yes | "$sdkmanager_bin" --install "${packages[@]}"; then
              set -o pipefail
              exit 0
            else
              install_status=$?
            fi
            set -o pipefail

            "$sdkmanager_bin" --uninstall "$system_image" || true
            if [[ "$attempt" -eq 3 ]]; then
              exit "$install_status"
            fi
            sleep "$((attempt * 10))"
          done

      - name: Build Android eCapture
        run: |
          ANDROID=1 make clean
          ANDROID=1 make env
          CROSS_ARCH=amd64 ANDROID=1 make nocore -j"$(nproc)"
          test -x bin/ecapture
          file bin/ecapture | grep -Eq 'x86-64|x86_64'

      - name: Build Conscrypt/BoringSSL workload
        env:
          ANDROID_API_LEVEL: ${{ matrix.api-level }}
        run: bash test/e2e/android/build_boringssl_client.sh "$ANDROID_API_LEVEL"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android BoringSSL modes
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODES: text keylog pcapng
          E2E_KEEP_ARTIFACTS: '1'
          E2E_ARTIFACT_ROOT: ${{ runner.temp }}/ecapture-e2e-android
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8192M
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot-save -noaudio -no-boot-anim -camera-back none -writable-system
          disable-animations: true
          script: bash test/e2e/android/run_android_e2e_tests.sh

      - name: Upload Android E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-boringssl-e2e-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/ecapture-e2e-android
          if-no-files-found: warn
          retention-days: 7
