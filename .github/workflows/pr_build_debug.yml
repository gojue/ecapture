name: PR Build (Debug)
on:
  pull_request:
    branches: [ master, v2, v1 ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-artifacts:
    runs-on: ubuntu-24.04
    name: Build Debug Artifacts
    timeout-minutes: 90
    continue-on-error: ${{ matrix.arch == 'loong64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64, loong64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Initialize build environment
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          bash builder/init_env.sh
          kernel_source=$(find "$PWD/.build/kernel-$TARGET_ARCH" -mindepth 1 -maxdepth 1 -type d -name 'linux-source*' | sort -V | tail -n 1)
          test -f "$kernel_source/Makefile"
          echo "KERN_HEADERS=$kernel_source" >> "$GITHUB_ENV"
          if [[ "$TARGET_ARCH" == loong64 ]]; then
            echo "LOONG64_VMLINUX=$kernel_source/vmlinux" >> "$GITHUB_ENV"
          fi

      - name: Check build configuration
        run: bash test/build/loong64_config_test.sh

      - name: Build Debug artifacts
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_VERSION: v0.0.0-pr-${{ github.event.number || 'dev' }}-debug
          LOONG64_TOOLCHAIN_TRACE: '1'
        run: |
          set -euo pipefail
          make clean
          make env
          DEBUG=1 make -f builder/Makefile.release release SNAPSHOT_VERSION="$BUILD_VERSION" \
            2>&1 | tee "$RUNNER_TEMP/ecapture-build.log"
          mkdir -p dist
          cp bin/ecapture-*.tar.gz dist/

      - name: Verify Loong64 artifact and startup
        if: matrix.arch == 'loong64'
        run: |
          builder/verify-loong64-artifact.sh \
            .build/linux-loong64/bin/ecapture .build/linux-loong64/libpcap/libpcap.a \
            .build/linux-loong64/libpcap/config.log "$RUNNER_TEMP/ecapture-build.log"
          qemu-loongarch64-static bin/ecapture --help >/dev/null
          CGO_ENABLED=0 GOOS=linux GOARCH=loong64 go test -c \
            -o "$RUNNER_TEMP/gotls.test" ./internal/probe/gotls
          qemu-loongarch64-static "$RUNNER_TEMP/gotls.test" -test.run '^TestDecodeInstructionLoong64$'

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecapture-v0.0.0-pr-${{ github.event.number || 'dev' }}-debug-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: List Built Artifacts
        run: |
          echo "Built debug artifacts:"
          ls -la dist/
          echo "Artifact sizes:"
          du -h dist/*
