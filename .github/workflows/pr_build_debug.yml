name: PR Build (Debug)
on:
  pull_request:
    branches: [ master, v2, v1 ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-artifacts:
    runs-on: ubuntu-24.04
    name: Build Debug Artifacts
    timeout-minutes: 90
    continue-on-error: ${{ matrix.arch == 'loong64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64, loong64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Install Compilers
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkgconf \
            libelf-dev \
            llvm-14 \
            clang-14 \
            bc bison dwarves flex libssl-dev \
            linux-tools-common \
            linux-tools-generic \
            gcc \
            gcc-aarch64-linux-gnu \
            linux-source
          if [[ "${{ matrix.arch }}" == loong64 ]]; then
            sudo apt-get install --yes clang-18 lld-18 llvm-18 llvm-18-tools \
              libc6-dev-loong64-cross linux-libc-dev-loong64-cross \
              libgcc-13-dev-loong64-cross libatomic1-loong64-cross qemu-user-static
          fi
          bpftool_bin=$(find /usr/lib -maxdepth 2 -type f -path '/usr/lib/linux-tools-*/bpftool' | sort -V | tail -n 1)
          test -x "$bpftool_bin"
          sudo ln -sf "$bpftool_bin" /usr/local/bin/bpftool
          for tool in "clang" "llc" "llvm-strip"
          do
            sudo rm -f /usr/bin/$tool
            sudo ln -s /usr/bin/$tool-14 /usr/bin/$tool
          done
          cd /usr/src
          source_file=$(find . -maxdepth 1 -name "*linux-source*.tar.bz2")
          source_dir=$(echo "$source_file" | sed 's/\.tar\.bz2//g')
          sudo tar -xf $source_file
          cd $source_dir
          test -f .config || sudo make oldconfig
          sudo make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare V=0


      - name: Prepare Loong64 target kernel
        if: matrix.arch == 'loong64'
        run: |
          set -euo pipefail
          source_file=$(find /usr/src -maxdepth 1 -name 'linux-source*.tar.*' | sort -V | tail -n 1)
          test -f "$source_file"
          mkdir -p "$RUNNER_TEMP/loong64-kernel"
          tar -xf "$source_file" -C "$RUNNER_TEMP/loong64-kernel"
          source_dir=$(find "$RUNNER_TEMP/loong64-kernel" -mindepth 1 -maxdepth 1 -type d -name 'linux-source*' | head -n 1)
          builder/prepare-loong64-kernel.sh "$source_dir"
          echo "KERN_HEADERS=$source_dir" >> "$GITHUB_ENV"
          echo "LOONG64_VMLINUX=$source_dir/vmlinux" >> "$GITHUB_ENV"

      - name: Check build configuration
        run: bash test/build/loong64_config_test.sh

      - name: Build Debug artifacts
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_VERSION: v0.0.0-pr-${{ github.event.number || 'dev' }}-debug
          LOONG64_TOOLCHAIN_TRACE: '1'
        run: |
          set -euo pipefail
          if [[ "$TARGET_ARCH" == amd64 ]]; then unset TARGET_ARCH; fi
          make clean
          make env
          DEBUG=1 make -f builder/Makefile.release release SNAPSHOT_VERSION="$BUILD_VERSION" \
            2>&1 | tee "$RUNNER_TEMP/ecapture-build.log"
          mkdir -p dist
          cp bin/ecapture-*.tar.gz dist/

      - name: Verify Loong64 artifact and startup
        if: matrix.arch == 'loong64'
        run: |
          builder/verify-loong64-artifact.sh \
            .build/linux-loong64/bin/ecapture .build/linux-loong64/libpcap/libpcap.a \
            .build/linux-loong64/libpcap/config.log "$RUNNER_TEMP/ecapture-build.log"
          qemu-loongarch64-static bin/ecapture --help >/dev/null
          CGO_ENABLED=0 GOOS=linux GOARCH=loong64 go test -c \
            -o "$RUNNER_TEMP/gotls.test" ./internal/probe/gotls
          qemu-loongarch64-static "$RUNNER_TEMP/gotls.test" -test.run '^TestDecodeInstructionLoong64$'

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecapture-v0.0.0-pr-${{ github.event.number || 'dev' }}-debug-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: List Built Artifacts
        run: |
          echo "Built debug artifacts:"
          ls -la dist/
          echo "Artifact sizes:"
          du -h dist/*
