name: Release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build-loong64:
    needs: build-amd64-arm64-and-publish
    runs-on: ubuntu-24.04
    name: Build and upload Linux Loong64 release artifacts
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Install Loong64 LLVM 18 cross-build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc bison clang-18 dwarves file flex \
            libatomic1-loong64-cross libc6-dev-loong64-cross libelf-dev \
            libgcc-13-dev-loong64-cross libssl-dev linux-libc-dev-loong64-cross \
            linux-source linux-tools-common linux-tools-generic lld-18 \
            llvm-18 llvm-18-tools make pkg-config xz-utils
          bpftool_bin="$(find /usr/lib -maxdepth 2 -type f -path '/usr/lib/linux-tools-*/bpftool' | sort -V | tail -n 1)"
          test -x "$bpftool_bin"
          sudo ln -sf "$bpftool_bin" /usr/local/bin/bpftool

      - name: Prepare Linux LoongArch BTF source
        id: kernel
        run: |
          source_file="$(find /usr/src -maxdepth 1 -name 'linux-source*.tar.*' | head -n 1)"
          test -n "$source_file"
          mkdir -p "$RUNNER_TEMP/loong64-kernel"
          tar -xf "$source_file" -C "$RUNNER_TEMP/loong64-kernel"
          source_dir="$(find "$RUNNER_TEMP/loong64-kernel" -mindepth 1 -maxdepth 1 -type d -name 'linux-source*' | head -n 1)"
          builder/prepare-loong64-kernel.sh "$source_dir"
          echo "source_dir=$source_dir" >>"$GITHUB_OUTPUT"

      - name: Build Linux Loong64 archive and deb
        env:
          LOONG64_TOOLCHAIN_TRACE: '1'
        run: |
          KERN_HEADERS="${{ steps.kernel.outputs.source_dir }}" \
            LOONG64_VMLINUX="${{ steps.kernel.outputs.source_dir }}/vmlinux" \
            CROSS_ARCH=loong64 \
            make -f builder/Makefile.release deb SNAPSHOT_VERSION=${{ github.ref_name }}
          builder/verify-loong64-artifact.sh \
            bin/ecapture \
            .build/linux-loong64/libpcap/libpcap.a \
            .build/linux-loong64/libpcap/config.log

      - uses: actions/upload-artifact@v4
        with:
          name: loong64-release-files
          path: |
            bin/*linux-loong64*.tar.gz
            bin/*linux_loong64.deb
          if-no-files-found: error
          retention-days: 1

      - name: Upload Loong64 assets and checksum to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bin
          sha256sum *linux-loong64*.tar.gz *linux_loong64.deb \
            > "checksum-loong64-${{ github.ref_name }}.txt"
          gh release upload "${{ github.ref_name }}" \
            *linux-loong64*.tar.gz \
            *linux_loong64.deb \
            "checksum-loong64-${{ github.ref_name }}.txt"

  build-amd64-arm64-and-publish:
    runs-on: ubuntu-22.04
    name: Build amd64/arm64 Linux/Android and publish release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Check Release Type
        id: release_type
        run: |
          TAG_NAME=${{ github.ref_name }}
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=stable" >> $GITHUB_OUTPUT
            echo "📦 Stable release detected: $TAG_NAME"
          elif [[ "$TAG_NAME" =~ (alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=prerelease" >> $GITHUB_OUTPUT
            echo "🚧 Pre-release detected: $TAG_NAME"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=stable" >> $GITHUB_OUTPUT
            echo "📦 Release: $TAG_NAME"
          fi
        shell: bash
      - name: Install Compilers
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkgconf \
            libelf-dev \
            llvm-14 \
            clang-14 \
            linux-tools-common \
            linux-tools-generic \
            gcc \
            gcc-aarch64-linux-gnu \
            linux-source
          for tool in "clang" "llc" "llvm-strip"
          do
            sudo rm -f /usr/bin/$tool
            sudo ln -s /usr/bin/$tool-14 /usr/bin/$tool
          done
          cd /usr/src
          source_file=$(find . -maxdepth 1 -name "*linux-source*.tar.bz2")
          source_dir=$(echo "$source_file" | sed 's/\.tar\.bz2//g')  
          sudo tar -xf $source_file
          cd $source_dir
          test -f .config || sudo make oldconfig
          sudo make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare V=0
          ls -al /usr/src/$source_dir
        shell: bash
      - name: authenticate
        run: |
          gh auth login --with-token <<<'${{ secrets.GITHUB_TOKEN }}'
      - name: Get Previous Tag
        id: previoustag
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREVIOUS_TAG=$PREVIOUS" >> $GITHUB_OUTPUT
      - name: Generate Release Notes
        id: release_notes
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=${{ github.ref_name }} \
            -f previous_tag_name=${{ steps.previoustag.outputs.PREVIOUS_TAG }} \
            > release_notes.json
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          jq -r .body release_notes.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Write File
        uses: DamianReeves/write-file-action@v1.2
        with:
          path: ./bin/release_notes.txt
          contents: |
            ${{ steps.release_notes.outputs.NOTES }}
          write-mode: append
      - name: Release amd64
        run: |
          make clean
          make env
          make -f builder/Makefile.release release SNAPSHOT_VERSION=${{ github.ref_name }}
      - name: Release arm64 (CROSS COMPILATION)
        run: |
          make clean
          make env
          CROSS_ARCH=arm64 make -f builder/Makefile.release release SNAPSHOT_VERSION=${{ github.ref_name }}
      - name: Publish
        env:
          IS_PRERELEASE: ${{ steps.release_type.outputs.IS_PRERELEASE }}
        run: |
          make -f builder/Makefile.release publish SNAPSHOT_VERSION=${{ github.ref_name }}
  build-docker-image:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check Release Type
        id: release_type
        run: |
          TAG_NAME=${{ github.ref_name }}
          if [[ "$TAG_NAME" =~ (alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "🚧 Pre-release detected for Docker: $TAG_NAME"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "📦 Stable release detected for Docker: $TAG_NAME"
          fi
        shell: bash
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Update submodule
        run: git submodule update --init
      - name: Prepare Docker Tags
        id: docker_tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/ecapture:${{ github.ref_name }}"
          if [[ "${{ steps.release_type.outputs.IS_PRERELEASE }}" == "false" ]]; then
            TAGS="${TAGS}
          ${{ secrets.DOCKERHUB_USERNAME }}/ecapture:latest"
            echo "📦 Adding 'latest' tag for stable release"
          else
            echo "🚧 Skipping 'latest' tag for pre-release"
          fi
          echo "TAGS<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ github.ref_name }}
          file: ./builder/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ecapture:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ecapture:buildcache,mode=max
          tags: ${{ steps.docker_tags.outputs.TAGS }}
