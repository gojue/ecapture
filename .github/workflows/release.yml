name: Release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build-artifacts:
    runs-on: ubuntu-24.04
    name: Build release artifacts (${{ matrix.arch }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, loong64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Initialize environment and build release artifacts
        id: build
        continue-on-error: ${{ matrix.arch == 'loong64' }}
        timeout-minutes: ${{ matrix.arch == 'loong64' && 60 || 110 }}
        env:
          LOONG64_TOOLCHAIN_TRACE: '1'
        shell: bash
        run: |
          set -euo pipefail
          bash builder/init_env.sh
          kernel_source=$(find "$PWD/.build/kernel-$TARGET_ARCH" -mindepth 1 -maxdepth 1 -type d -name 'linux-source*' | sort -V | tail -n 1)
          test -f "$kernel_source/Makefile"
          export KERN_HEADERS="$kernel_source"
          if [[ "$TARGET_ARCH" == loong64 ]]; then
            test -f "$kernel_source/vmlinux"
            export LOONG64_VMLINUX="$kernel_source/vmlinux"
          fi
          make clean
          make env
          make -f builder/Makefile.release release SNAPSHOT_VERSION="$RELEASE_VERSION" \
            2>&1 | tee "$RUNNER_TEMP/ecapture-build.log"
          if [[ "$TARGET_ARCH" == loong64 ]]; then
            builder/verify-loong64-artifact.sh \
              .build/linux-loong64/bin/ecapture .build/linux-loong64/libpcap/libpcap.a \
              .build/linux-loong64/libpcap/config.log "$RUNNER_TEMP/ecapture-build.log"
          else
            test -s "bin/ecapture-$RELEASE_VERSION-android-$TARGET_ARCH.tar.gz"
          fi
          test -s "bin/ecapture-$RELEASE_VERSION-linux-$TARGET_ARCH.tar.gz"
          test -s "bin/ecapture_${RELEASE_VERSION}_linux_$TARGET_ARCH.deb"

      - name: Report optional Loong64 build failure
        if: matrix.arch == 'loong64' && steps.build.outcome == 'failure'
        run: echo "::warning::Loong64 build failed; publishing validated amd64/arm64 artifacts only"

      - name: Upload validated release artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            bin/ecapture-${{ env.RELEASE_VERSION }}-*-${{ matrix.arch }}.tar.gz
            bin/ecapture_${{ env.RELEASE_VERSION }}_linux_${{ matrix.arch }}.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build-artifacts
    runs-on: ubuntu-24.04
    name: Publish release artifacts and Docker images
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download validated release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: bin
          merge-multiple: true

      - name: Check required release packages
        run: |
          for arch in amd64 arm64; do
            test -s "bin/ecapture-$RELEASE_VERSION-linux-$arch.tar.gz"
            test -s "bin/ecapture-$RELEASE_VERSION-android-$arch.tar.gz"
            test -s "bin/ecapture_${RELEASE_VERSION}_linux_$arch.deb"
          done

      - name: Check Release Type
        id: release_type
        run: |
          TAG_NAME="$RELEASE_VERSION"
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "📦 Stable release detected: $TAG_NAME"
          elif [[ "$TAG_NAME" =~ (alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
            echo "🚧 Pre-release detected: $TAG_NAME"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "📦 Release: $TAG_NAME"
          fi
        shell: bash

      - name: Get Previous Tag
        id: previoustag
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREVIOUS_TAG=$PREVIOUS" >> "$GITHUB_OUTPUT"
      - name: Generate Release Notes
        env:
          GH_REPO: ${{ github.repository }}
          PREVIOUS_TAG: ${{ steps.previoustag.outputs.PREVIOUS_TAG }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_VERSION" \
            -f previous_tag_name="$PREVIOUS_TAG" \
            > release_notes.json
          jq -r .body release_notes.json > bin/release_notes.txt

      - name: Publish
        env:
          IS_PRERELEASE: ${{ steps.release_type.outputs.IS_PRERELEASE }}
        run: |
          make -f builder/Makefile.release publish SNAPSHOT_VERSION="$RELEASE_VERSION"

      - name: Prepare Docker binaries from release packages
        id: docker_binaries
        run: |
          set -euo pipefail
          arches=(amd64 arm64)
          if [[ -f "bin/ecapture-$RELEASE_VERSION-linux-loong64.tar.gz" ]]; then
            arches+=(loong64)
          fi
          platforms=()
          for arch in "${arches[@]}"; do
            package="ecapture-$RELEASE_VERSION-linux-$arch"
            destination="$RUNNER_TEMP/ecapture-docker/$arch"
            mkdir -p "$destination"
            tar -xzf "bin/$package.tar.gz" -C "$destination" \
              --strip-components=1 "$package/ecapture"
            test -x "$destination/ecapture"
            platforms+=("linux/$arch")
          done
          (IFS=,; echo "platforms=${platforms[*]}") >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare Docker Tags
        id: docker_tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IS_PRERELEASE: ${{ steps.release_type.outputs.IS_PRERELEASE }}
        run: |
          TAGS="$DOCKERHUB_USERNAME/ecapture:$RELEASE_VERSION"
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            TAGS="${TAGS}
          $DOCKERHUB_USERNAME/ecapture:latest"
            echo "📦 Adding 'latest' tag for stable release"
          else
            echo "🚧 Skipping 'latest' tag for pre-release"
          fi
          printf 'TAGS<<EOF\n%s\nEOF\n' "$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/ecapture-docker
          file: ./builder/Dockerfile
          platforms: ${{ steps.docker_binaries.outputs.platforms }}
          push: true
          tags: ${{ steps.docker_tags.outputs.TAGS }}
