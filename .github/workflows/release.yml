name: Release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build-and-publish:
    runs-on: ubuntu-24.04
    name: Build and publish release artifacts and Docker images
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Check Release Type
        id: release_type
        run: |
          TAG_NAME=${{ github.ref_name }}
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=stable" >> $GITHUB_OUTPUT
            echo "📦 Stable release detected: $TAG_NAME"
          elif [[ "$TAG_NAME" =~ (alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=prerelease" >> $GITHUB_OUTPUT
            echo "🚧 Pre-release detected: $TAG_NAME"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=stable" >> $GITHUB_OUTPUT
            echo "📦 Release: $TAG_NAME"
          fi
        shell: bash
      - name: Install Compilers
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkgconf \
            libelf-dev \
            llvm-14 \
            clang-14 \
            bc bison dwarves flex libssl-dev \
            linux-tools-common \
            linux-tools-generic \
            gcc \
            gcc-aarch64-linux-gnu \
            linux-source
          for tool in "clang" "llc" "llvm-strip"
          do
            sudo rm -f /usr/bin/$tool
            sudo ln -s /usr/bin/$tool-14 /usr/bin/$tool
          done
          bpftool_bin=$(find /usr/lib -maxdepth 2 -type f -path '/usr/lib/linux-tools-*/bpftool' | sort -V | tail -n 1)
          test -x "$bpftool_bin"
          sudo ln -sf "$bpftool_bin" /usr/local/bin/bpftool
          cd /usr/src
          source_file=$(find . -maxdepth 1 -name "*linux-source*.tar.bz2")
          source_dir=$(echo "$source_file" | sed 's/\.tar\.bz2//g')  
          sudo tar -xf $source_file
          cd $source_dir
          test -f .config || sudo make oldconfig
          sudo make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare V=0
          ls -al /usr/src/$source_dir
        shell: bash
      - name: authenticate
        run: |
          gh auth login --with-token <<<'${{ secrets.GITHUB_TOKEN }}'
      - name: Get Previous Tag
        id: previoustag
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREVIOUS_TAG=$PREVIOUS" >> $GITHUB_OUTPUT
      - name: Generate Release Notes
        id: release_notes
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=${{ github.ref_name }} \
            -f previous_tag_name=${{ steps.previoustag.outputs.PREVIOUS_TAG }} \
            > release_notes.json
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          jq -r .body release_notes.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Write File
        uses: DamianReeves/write-file-action@v1.2
        with:
          path: ./bin/release_notes.txt
          contents: |
            ${{ steps.release_notes.outputs.NOTES }}
          write-mode: append
      - name: Release amd64
        run: |
          make clean
          make env
          make -f builder/Makefile.release release SNAPSHOT_VERSION=${{ github.ref_name }}
      - name: Release arm64 (CROSS COMPILATION)
        run: |
          make clean
          make env
          TARGET_ARCH=arm64 make -f builder/Makefile.release release SNAPSHOT_VERSION=${{ github.ref_name }}
      - name: Release loong64 (CROSS COMPILATION)
        id: loong64
        continue-on-error: true
        timeout-minutes: 60
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          LOONG64_TOOLCHAIN_TRACE: '1'
        run: |
          set -euo pipefail
          sudo apt-get install --yes clang-18 lld-18 llvm-18 llvm-18-tools \
            libc6-dev-loong64-cross linux-libc-dev-loong64-cross \
            libgcc-13-dev-loong64-cross libatomic1-loong64-cross
          source_file=$(find /usr/src -maxdepth 1 -name 'linux-source*.tar.*' | sort -V | tail -n 1)
          test -f "$source_file"
          mkdir -p "$RUNNER_TEMP/loong64-kernel"
          tar -xf "$source_file" -C "$RUNNER_TEMP/loong64-kernel"
          source_dir=$(find "$RUNNER_TEMP/loong64-kernel" -mindepth 1 -maxdepth 1 -type d -name 'linux-source*' | head -n 1)
          builder/prepare-loong64-kernel.sh "$source_dir"
          export TARGET_ARCH=loong64 KERN_HEADERS="$source_dir" LOONG64_VMLINUX="$source_dir/vmlinux"
          make clean
          make env
          make -f builder/Makefile.release release SNAPSHOT_VERSION="$RELEASE_VERSION" \
            2>&1 | tee "$RUNNER_TEMP/loong64-build.log"
          builder/verify-loong64-artifact.sh \
            .build/linux-loong64/bin/ecapture .build/linux-loong64/libpcap/libpcap.a \
            .build/linux-loong64/libpcap/config.log "$RUNNER_TEMP/loong64-build.log"

      - name: Exclude incomplete Loong64 artifacts
        if: steps.loong64.outcome == 'failure'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          rm -f "bin/ecapture-$RELEASE_VERSION-linux-loong64.tar.gz" \
            "bin/ecapture_${RELEASE_VERSION}_linux_loong64.deb"
          echo "::warning::Loong64 build failed; publishing validated amd64/arm64 artifacts only"

      - name: Publish
        env:
          IS_PRERELEASE: ${{ steps.release_type.outputs.IS_PRERELEASE }}
        run: |
          make -f builder/Makefile.release publish SNAPSHOT_VERSION=${{ github.ref_name }}

      - name: Prepare Docker binaries from release packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            package="ecapture-$RELEASE_VERSION-linux-$arch"
            destination="$RUNNER_TEMP/ecapture-docker/$arch"
            mkdir -p "$destination"
            tar -xzf "bin/$package.tar.gz" -C "$destination" \
              --strip-components=1 "$package/ecapture"
            test -x "$destination/ecapture"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare Docker Tags
        id: docker_tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/ecapture:${{ github.ref_name }}"
          if [[ "${{ steps.release_type.outputs.IS_PRERELEASE }}" == "false" ]]; then
            TAGS="${TAGS}
          ${{ secrets.DOCKERHUB_USERNAME }}/ecapture:latest"
            echo "📦 Adding 'latest' tag for stable release"
          else
            echo "🚧 Skipping 'latest' tag for pre-release"
          fi
          echo "TAGS<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/ecapture-docker
          file: ./builder/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.TAGS }}
