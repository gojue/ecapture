name: E2E Tests

on:
  pull_request:
    branches: [master, v2, v1]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, v2, v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls-e2e:
    name: E2E Tests (TLS/GnuTLS/GoTLS) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Install build and workload dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libelf-dev \
            llvm-14 \
            clang-14 \
            linux-tools-common \
            linux-tools-generic \
            linux-source \
            libssl-dev \
            libgnutls28-dev
          for tool in clang llc llvm-strip; do
            sudo ln -sf "/usr/bin/${tool}-14" "/usr/bin/${tool}"
          done

      - name: Prepare Linux source
        run: |
          source_file="$(find /usr/src -maxdepth 1 -name 'linux-source*.tar.bz2' | head -n 1)"
          if [[ -n "$source_file" ]]; then
            source_dir="${source_file%.tar.bz2}"
            if [[ ! -d "$source_dir" ]]; then
              sudo tar -xf "$source_file" -C /usr/src
            fi
            if [[ ! -f "$source_dir/.config" ]]; then
              if [[ -r "/boot/config-$(uname -r)" ]]; then
                sudo cp "/boot/config-$(uname -r)" "$source_dir/.config"
                sudo make -C "$source_dir" olddefconfig
              else
                sudo make -C "$source_dir" defconfig
              fi
            fi
          fi

      - name: Build eCapture
        run: |
          make clean
          make env
          make -j"$(nproc)"
          test -x bin/ecapture
          file bin/ecapture

      - name: OpenSSL and GoTLS (gating)
        run: |
          sudo env \
            PATH="$PATH" \
            GOCACHE="$RUNNER_TEMP/ecapture-go-cache" \
            E2E_MODULES='tls gotls' \
            E2E_MODES='text keylog pcapng' \
            E2E_KEEP_ARTIFACTS=1 \
            E2E_ARTIFACT_ROOT="$RUNNER_TEMP/ecapture-e2e" \
            bash test/e2e/run_e2e.sh

      # The GnuTLS probe is currently a scaffold. Keep executing its complete
      # contract so the gap stays visible, but do not gate unrelated changes
      # until the probe attaches data/master-secret/TC programs.
      - name: GnuTLS contract (known implementation gap)
        if: always()
        continue-on-error: true
        run: |
          sudo env \
            PATH="$PATH" \
            GOCACHE="$RUNNER_TEMP/ecapture-go-cache" \
            E2E_MODULES=gnutls \
            E2E_MODES='text keylog pcapng' \
            E2E_KEEP_ARTIFACTS=1 \
            E2E_ARTIFACT_ROOT="$RUNNER_TEMP/ecapture-e2e" \
            bash test/e2e/run_e2e.sh

      - name: Make artifacts readable
        if: always()
        run: sudo chown -R "$USER":"$USER" "$RUNNER_TEMP/ecapture-e2e" 2>/dev/null || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tls-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/ecapture-e2e
          if-no-files-found: warn
          retention-days: 7
