name: Native Loong64 unit tests

on:
  push:
    branches: [master, v2, v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls-unit:
    if: >-
      github.repository == 'gojue/ecapture' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJSON('["refs/heads/master","refs/heads/v2","refs/heads/v1"]'), github.ref)
    runs-on: [self-hosted, Linux, loongarch64, ecapture]
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - name: Check native environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = loongarch64
          kernel=$(uname -r | cut -d- -f1)
          test "$(printf '%s\n' 6.6 "$kernel" | sort -V | head -n1)" = 6.6
          test "$(go env GOOS)/$(go env GOARCH)" = linux/loong64
          go version
          git --version

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      # The host supplies native Go. setup-go's hosted tool cache does not
      # provide LoongArch packages. Stub assets do not load eBPF programs.
      - name: Run native TLS module unit tests
        run: >-
          go test -count=1 -timeout=10m
          ./internal/probe/openssl ./internal/probe/gotls ./internal/probe/gnutls
